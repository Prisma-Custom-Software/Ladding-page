<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prisma — slide</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; background: #05070d; height: 100%; }
  body { display: grid; place-items: center; }
  canvas { width: min(100vw, calc(100vh * 0.8)); height: auto; display: block; }
  body.capture canvas { width: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="engine/core.js"></script>
<script src="engine/draw.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/stage.js"></script>
<script src="slides/s1.js"></script>
<script src="slides/s2.js"></script>
<script src="slides/s3.js"></script>
<script src="slides/s4.js"></script>
<script src="slides/s5.js"></script>
<script src="slides/s6.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const n = +(q.get('n') || 1);
  const canvas = document.getElementById('c');
  await P.loadFonts();
  const stage = P.stage(canvas, P.SLIDES[n]);
  window.__frame = (t, type = 'image/png', qual) => { stage.draw(t); return canvas.toDataURL(type, qual); };
  window.__draw = (t) => stage.draw(t);
  window.__audio = async () => {
    const buf = P.wav(await P.renderAudio(P.SLIDES[n]));
    let s = '', u = new Uint8Array(buf);
    for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  };
  if (q.has('capture')) { document.body.classList.add('capture'); window.__ready = true; return; }
  if (q.has('t')) { stage.draw(+q.get('t')); window.__ready = true; return; }
  window.__ready = true;
  const t0 = performance.now();
  const loop = () => { stage.draw(((performance.now() - t0) / 1000) % P.DUR); requestAnimationFrame(loop); };
  loop();
})();
</script>
</body>
</html>
